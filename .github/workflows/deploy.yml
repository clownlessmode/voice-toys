name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OZON_DELIVERY_CLIENT_ID: ${{ secrets.OZON_DELIVERY_CLIENT_ID }}
      OZON_DELIVERY_CLIENT_SECRET: ${{ secrets.OZON_DELIVERY_CLIENT_SECRET }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: OZON_DELIVERY_CLIENT_ID,OZON_DELIVERY_CLIENT_SECRET
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            export PATH="/usr/local/lib/nodejs/node-v24.19.0-linux-x64/bin:/usr/local/bin:/usr/bin:/bin"

            cd /var/www/voice-toys

            update_env_file() {
              env_key="$1"
              env_value="$2"
              env_tmp_file="$(mktemp .env.local.XXXXXX)"
              if [ -f .env.local ]; then
                grep -v "^${env_key}=" .env.local > "$env_tmp_file" || true
              fi
              printf '%s=%s\n' "$env_key" "$env_value" >> "$env_tmp_file"
              chmod 600 "$env_tmp_file"
              chown voicetoys:voicetoys "$env_tmp_file"
              mv "$env_tmp_file" .env.local
            }

            test -n "$OZON_DELIVERY_CLIENT_ID"
            test -n "$OZON_DELIVERY_CLIENT_SECRET"
            update_env_file OZON_DELIVERY_CLIENT_ID "$OZON_DELIVERY_CLIENT_ID"
            update_env_file OZON_DELIVERY_CLIENT_SECRET "$OZON_DELIVERY_CLIENT_SECRET"

            database_url="$(sed -n 's/^DATABASE_URL=//p' .env | tail -n 1)"
            if [[ "$database_url" == file:* ]]; then
              database_file="${database_url#file:}"
              if [[ "$database_file" != /* ]]; then
                database_file="/var/www/voice-toys/prisma/${database_file#./}"
              fi
              if [ -f "$database_file" ]; then
                mkdir -p /var/backups/voice-toys
                cp "$database_file" "/var/backups/voice-toys/database-$(date -u +%Y%m%dT%H%M%SZ).sqlite"
              fi
            fi

            sudo -u voicetoys -H git fetch origin main
            sudo -u voicetoys -H git reset --hard origin/main

            sudo -u voicetoys -H env PATH="$PATH" npm ci
            sudo -u voicetoys -H env PATH="$PATH" npx prisma migrate deploy
            sudo -u voicetoys -H env PATH="$PATH" npm run build

            systemctl restart voice-toys
            systemctl is-active --quiet voice-toys

            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/ >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 10 ]; then
                echo "Application health check failed" >&2
                exit 1
              fi
              sleep 3
            done

            echo "Deploy finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 \
            https://voicetoys.ru/ >/dev/null
          points_json="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 \
            'https://voicetoys.ru/api/ozon-delivery/points?limit=1')"
          jq -e '.points | type == "array" and length > 0' <<<"$points_json" >/dev/null
